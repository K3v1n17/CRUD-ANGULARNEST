<div class="d-flex justify-content-center align-items-center vh-100">
  <div class="card shadow-sm p-4" style="width: 100%; max-width: 400px;">
    <div class="text-center mb-3">
      <div class="avatar-circle mx-auto mb-3" style="width: 3.5rem; height: 3.5rem; font-size: 1.5rem;">👋</div>
      <h1 class="h4 mb-1">¡Hola de nuevo!</h1>
      <p class="text-muted small mb-0">Ingresa tus datos para gestionar tus clientes</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <div class="form-floating mb-3">
        <input
          id="email"
          type="email"
          class="form-control"
          [class.is-invalid]="form.controls.email.invalid && form.controls.email.touched"
          formControlName="email"
          placeholder="nombre@ejemplo.com"
        />

        <label for="email">Correo electrónico</label>
        <div class="invalid-feedback">Ingresa un correo electrónico válido.</div>
      </div>

      <div class="form-floating mb-3">
        <input

          id="password"
          type="password"
          class="form-control"
          [class.is-invalid]="form.controls.password.invalid && form.controls.password.touched"
          formControlName="password"
          placeholder="Contraseña"
        />
        <label for="password">Contraseña</label>
        <div class="invalid-feedback">La contraseña debe tener al menos 6 caracteres.</div>
      </div>

      @if (error$ | async; as error) {
        <div class="alert alert-danger py-2 small" role="alert">{{ error }}</div>
      }

      <button type="submit" class="btn btn-primary w-100" [disabled]="loading$ | async">
        @if (loading$ | async) {
          <span class="spinner-border spinner-border-sm me-2" role="status"></span>
        }
        Ingresar
      </button>
    </form>
  </div>
</div>
